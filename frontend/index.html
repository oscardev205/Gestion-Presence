<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion Présence</title>
    <style>
      #chargement-initial {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f7f7f5;
        z-index: 9999;
      }
      #chargement-initial svg {
        width: 64px;
        height: 64px;
        animation: pulseChargement 1.4s ease-in-out infinite;
      }
      #chargement-initial p {
        margin-top: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        font-size: 13px;
        color: #6b6b66;
      }
      @keyframes pulseChargement {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.94); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="chargement-initial">
        <svg viewBox="0 0 180 180">
          <defs>
            <linearGradient id="degLigneChargement" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7CD9BB" />
              <stop offset="55%" stop-color="#0F6E56" />
              <stop offset="100%" stop-color="#085041" />
            </linearGradient>
            <linearGradient id="degFondChargement" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0B2B24" />
              <stop offset="100%" stop-color="#153F34" />
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="180" height="180" rx="46" fill="url(#degFondChargement)" />
          <path d="M98 42 C60 30, 32 52, 32 90 C32 128, 60 148, 94 140 C106 137, 112 130, 114 116" fill="none" stroke="url(#degLigneChargement)" stroke-width="15" stroke-linecap="round" />
          <path d="M114 116 L114 44" fill="none" stroke="url(#degLigneChargement)" stroke-width="15" stroke-linecap="round" />
          <path d="M114 44 C143 44, 155 58, 155 76 C155 94, 143 101, 117 99" fill="none" stroke="url(#degLigneChargement)" stroke-width="15" stroke-linecap="round" />
        </svg>
        <p>Chargement...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
